server:
  port: 8080

spring:
  application:
    name: smart-ledger-backend
  profiles:
    # dev：本地开发基础覆盖；local：本地私有密钥（application-local.yml，已被 .gitignore 排除）
    # 若本地没有 application-local.yml，该项不会报错，会自动跳过。
    active: dev,local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_ledger?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:118523}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

smartledger:
  jwt:
    secret: ${JWT_SECRET:smart-ledger-dev-secret-key-please-change-in-production-0123456789}
    expire-days: 7
  upload:
    # 图片上传目录（相对或绝对路径），默认应用运行目录下 uploads
    dir: ${UPLOAD_DIR:./uploads}
  wx:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
    # 本地开发无真实小程序凭据时可开启，用 code 生成 mock openid（生产必须为 false）
    mock-enabled: false
  ai:
    # 大模型解析开关（保留能力）；置 false 时自动回落到本地规则解析
    enabled: ${AI_ENABLED:true}
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    connect-timeout: 3000
    read-timeout: 12000
    max-retries: 1
    temperature: 0.2
    cache-seconds: 60
    max-input-length: 200
    rate-limit-per-minute: 20
    rag:
      # 检索增强：解析前召回相似历史记账作为 few-shot（需要向量模型 Key）
      enabled: ${AI_RAG_ENABLED:false}
      base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      embedding-model: ${EMBEDDING_MODEL:text-embedding-v4}
      # 5 条 → 3 条：Prompt token 降约 9%，P95 由约 5.1s 降到约 4.4s，准确率无显著下降（见 README 消融）
      top-k: 3
      min-score: 0.45
      bank-path: classpath:ai/rag-bank.jsonl
      connect-timeout: 3000
      # 实测向量接口 P95 约 260ms（单条），这里留足余量并避免异常长尾拖慢解析
      read-timeout: 2500
  vision:
    # 拍照识别（多模态）：OpenAI 兼容协议，默认对接阿里云百炼通义千问视觉模型
    # 置 false 时拍照仅保存小票图片，不返回识别结果
    enabled: ${VISION_ENABLED:true}
    base-url: ${VISION_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${VISION_MODEL:qwen3-vl-plus}
    connect-timeout: 5000
    read-timeout: 30000
    max-retries: 1
    temperature: 0.1
    max-tokens: 512

logging:
  level:
    com.smartledger: debug