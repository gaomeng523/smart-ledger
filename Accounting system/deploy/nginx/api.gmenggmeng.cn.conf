# ============================================================
# smart-ledger 小程序后端 · Nginx 反向代理配置
#
# 域名：api.gmenggmeng.cn  ->  本机 Spring Boot 127.0.0.1:8080
#
# 部署位置（OpenCloudOS / CentOS 系）：/etc/nginx/conf.d/api.gmenggmeng.cn.conf
# 证书位置：/etc/nginx/ssl/  （腾讯云免费证书下载 Nginx 版后上传）
#
# 生效命令：
#   nginx -t && systemctl reload nginx
# ============================================================

# ---------- HTTP：全部 301 跳转到 HTTPS ----------
server {
    listen       80;
    listen       [::]:80;
    server_name  api.gmenggmeng.cn;

    # 小程序接口不提供 HTTP 明文访问，一律跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 正式入口 ----------
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    server_name  api.gmenggmeng.cn;

    # nginx 1.25.1+ 起，http2 由独立指令开启（旧写法 listen ... http2 已废弃）
    http2        on;

    # 腾讯云免费证书（Nginx 版）：.pem 为证书，.key 为私钥
    ssl_certificate      /etc/nginx/ssl/api.gmenggmeng.cn.pem;
    ssl_certificate_key  /etc/nginx/ssl/api.gmenggmeng.cn.key;

    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  5m;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;

    # 账单导入上传文件，与 Spring Boot multipart 限制对齐
    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket 支持（后续私信功能预留，无 WS 请求时不影响普通接口）
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
