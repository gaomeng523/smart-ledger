# 本地开发环境覆盖项
# 说明：无真实微信小程序凭据时，开启 mock 登录，用 code 直接生成 openid，便于本地联调。
#       生产环境（prod）必须关闭 mock-enabled。
smartledger:
  wx:
    mock-enabled: true
  ai:
    enabled: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.smartledger: debug